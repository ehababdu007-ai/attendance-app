<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام تسجيل الحضور بالباركود</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root { --primary-color: #0d9488; --bg-color: #f1f5f9; --card-bg: #ffffff; }
    body { font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg-color); margin: 0; padding: 12px; direction: rtl; }
    .container { max-width: 480px; margin: 0 auto; background: var(--card-bg); padding: 16px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
    .title { text-align: center; margin: 0 0 15px 0; color: #0f172a; font-size: 20px; font-weight: 800; }
    .input-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; font-size: 13px; font-weight: 700; color: #475569; }
    input[type="text"] { width: 100%; padding: 12px; border: 1.5px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 15px; outline: none; }
    input[type="text"]:focus { border-color: var(--primary-color); }
    .btn { width: 100%; padding: 12px; background-color: var(--primary-color); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
    #reader { width: 100%; margin-top: 15px; border-radius: 12px; overflow: hidden; background: #000; min-height: 250px; }
    
    #student-card {
      margin-top: 15px;
      padding: 16px;
      border-radius: 12px;
      display: none;
      text-align: center;
      animation: fadeIn 0.3s ease-in-out;
    }
    .card-success { background-color: #d1fae5; border: 2px solid #10b981; color: #065f46; }
    .card-warning { background-color: #fef3c7; border: 2px solid #f59e0b; color: #92400e; }
    .card-error { background-color: #fee2e2; border: 2px solid #ef4444; color: #991b1b; }

    .student-name { font-size: 20px; font-weight: bold; margin-bottom: 6px; }
    .student-details { font-size: 14px; opacity: 0.9; margin-bottom: 4px; }
    .status-msg { font-size: 13px; font-weight: 600; margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(0,0,0,0.15); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="container">
  <h3 class="title">نظام تسجيل الحضور بالباركود</h3>

  <div class="input-group">
    <label>اسم الجلسة / المحاضرة:</label>
    <input type="text" id="sessionName" value="محاضرة اليوم">
  </div>

  <div class="input-group">
    <label>إدخال يدوي أو القارئ الخارجي:</label>
    <div style="display: flex; gap: 8px;">
      <input type="text" id="manualCode" placeholder="أدخل كود الطالب...">
      <button class="btn" onclick="processManual()" style="width: 32%;">تسجيل</button>
    </div>
  </div>

  <div id="reader"></div>

  <div id="student-card">
    <div class="student-name" id="card-name">--</div>
    <div class="student-details" id="card-info">--</div>
    <div class="status-msg" id="card-status">--</div>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzn3THPIqzLOrHsoIAY3LKSn-FfiTmt02R38huQ-75b_UqyyN_K9KZuGuuJi0niwaWzLw/exec";

  let html5QrcodeScanner;
  let isProcessing = false;

  window.onload = function() {
    startCameraScanner();
  };

  function startCameraScanner() {
    html5QrcodeScanner = new Html5QrcodeScanner(
      "reader", 
      { fps: 15, qrbox: { width: 250, height: 250 } }, 
      false
    );
    html5QrcodeScanner.render(onScanSuccess);
  }

  function onScanSuccess(decodedText) {
    if (isProcessing) return;
    handleScan(decodedText);
  }

  function processManual() {
    const codeInput = document.getElementById('manualCode');
    const code = codeInput.value.trim();
    if (code) {
      handleScan(code);
      codeInput.value = '';
    }
  }

  function handleScan(code) {
    isProcessing = true;
    const session = document.getElementById('sessionName').value.trim();
    showCard("جاري الاستعلام وتسجيل الحضور...", "الكود: " + code, "جاري الاتصال بالسيرفر...", "warning");

    fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "recordScan", code: code, sessionName: session })
    })
    .then(response => response.json())
    .then(res => {
      if (res.success) {
        showCard(
          "✅ " + res.student.name,
          "الكود: " + res.student.code + " | الصف: " + res.student.grade + " | المجموعة: " + res.student.group,
          "تم تسجيل الحضور بنجاح الساعة " + res.timestamp,
          "success"
        );
      } else if (res.duplicate) {
        showCard(
          "⚠️️ " + res.student.name,
          "الكود: " + res.student.code + " | الصف: " + res.student.grade,
          res.message,
          "warning"
        );
      } else {
        showCard("❌ كود غير مسجل", "الكود الممسوح: " + code, res.message, "error");
      }
      setTimeout(() => { isProcessing = false; }, 2500);
    })
    .catch(err => {
      showCard("❌ خطأ في الشبكة", "الكود: " + code, "تعذر الاتصال بقاعدة البيانات: " + err, "error");
      setTimeout(() => { isProcessing = false; }, 2000);
    });
  }

  function showCard(name, info, status, type) {
    const card = document.getElementById('student-card');
    document.getElementById('card-name').innerText = name;
    document.getElementById('card-info').innerText = info;
    document.getElementById('card-status').innerText = status;

    card.className = "card-" + type;
    card.style.display = "block";
  }
</script>

</body>
</html>
