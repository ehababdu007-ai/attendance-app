<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام تسجيل الحضور والاختبارات</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root { --primary-color: #0d9488; --bg-color: #f1f5f9; --card-bg: #ffffff; }
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg-color); margin: 0; padding: 12px; direction: rtl; }
    .container { max-width: 480px; margin: 0 auto; background: var(--card-bg); padding: 16px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
    .title { text-align: center; margin: 0 0 10px 0; color: #0f172a; font-size: 20px; font-weight: 800; }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #e2e8f0;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
      transition: background 0.3s;
    }
    .status-bar.online-clean { background: #d1fae5; }
    .status-bar.online-pending { background: #fef3c7; }
    .status-bar.offline { background: #fee2e2; }
    .status-online { color: #059669; }
    .status-offline { color: #dc2626; }
    .status-pending { color: #d97706; }

    .admin-buttons {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .admin-btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 8px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      transition: opacity 0.2s;
    }
    .admin-btn:hover { opacity: 0.85; }
    .btn-clear-today { background: #f59e0b; }
    .btn-hard-reset { background: #dc2626; }
    .btn-diagnostics { background: #8b5cf6; }
    .btn-view-pending { background: #0ea5e9; }

    .sync-btn {
      width: 100%;
      padding: 10px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
      display: none;
      transition: background 0.2s;
      animation: pulseBlue 2s infinite;
    }
    @keyframes pulseBlue {
      0%, 100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.5); }
      50% { box-shadow: 0 0 0 8px rgba(37, 99, 235, 0); }
    }
    .sync-btn:hover:not(:disabled) { background-color: #1d4ed8; }
    .sync-btn:disabled { background-color: #94a3b8; cursor: not-allowed; animation: none; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .input-group { margin-bottom: 10px; position: relative; }
    label { display: block; margin-bottom: 4px; font-size: 12px; font-weight: 700; color: #475569; }
    input[type="text"], select {
      width: 100%;
      padding: 9px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
      outline: none;
      background: white;
      font-family: inherit;
    }
    input[type="text"]:focus, select:focus { border-color: var(--primary-color); box-shadow: 0 0 0 2px rgba(13, 148, 136, 0.2); }
    .btn { width: 100%; padding: 10px; background-color: var(--primary-color); color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; }
    .btn:hover { background-color: #0f766e; }
    .btn-secondary { background-color: #64748b; }
    .btn-secondary:hover { background-color: #475569; }

    .search-results-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      z-index: 9999;
      background: #ffffff;
      border: 1.5px solid var(--primary-color);
      border-radius: 8px;
      max-height: 280px;
      overflow-y: auto;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      margin-top: 4px;
      display: none;
    }
    .search-item {
      padding: 10px 12px;
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
      text-align: right;
      transition: background 0.15s;
    }
    .search-item:hover, .search-item:active { background-color: #ccfbf1; }
    .search-item-name { font-size: 14px; font-weight: bold; color: #0f172a; }
    .search-item-meta { font-size: 11px; color: #64748b; margin-top: 2px; }

    .scanner-mode-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 700;
    }
    .mode-keyboard { background: #dbeafe; color: #1e40af; }
    .mode-scanner { background: #dcfce7; color: #166534; }

    #reader { width: 100%; margin-top: 10px; border-radius: 12px; overflow: hidden; background: #000; min-height: 220px; }
    #reader.hidden { display: none; }

    .camera-controls { display: flex; gap: 8px; margin-top: 10px; }

    #student-card {
      margin-top: 12px;
      padding: 14px;
      border-radius: 12px;
      display: none;
      text-align: center;
      animation: fadeIn 0.15s ease-in-out;
    }
    .card-success { background-color: #d1fae5; border: 2px solid #10b981; color: #065f46; }
    .card-warning { background-color: #fef3c7; border: 2px solid #f59e0b; color: #92400e; }
    .card-error { background-color: #fee2e2; border: 2px solid #ef4444; color: #991b1b; }

    .student-name { font-size: 19px; font-weight: bold; margin-bottom: 4px; }
    .student-details { font-size: 13px; opacity: 0.9; margin-bottom: 4px; line-height: 1.6; }
    .status-msg { font-size: 12px; font-weight: 600; margin-top: 6px; padding-top: 6px; border-top: 1px dashed rgba(0,0,0,0.15); }

    .undo-btn {
      margin-top: 10px;
      padding: 6px 14px;
      background-color: #ef4444;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .undo-btn:hover { background-color: #dc2626; }

    .stats-panel {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .rate-display {
      text-align: center;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px dashed #cbd5e1;
    }
    .rate-display-label {
      font-size: 11px;
      color: #64748b;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .rate-display-value {
      font-size: 32px;
      font-weight: 900;
      color: #0d9488;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .progress-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .progress-icon {
      font-size: 16px;
      width: 22px;
      text-align: center;
      flex-shrink: 0;
    }
    .progress-bar-container {
      flex: 1;
      height: 14px;
      background: #f1f5f9;
      border-radius: 7px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 7px;
      transition: width 0.4s ease-out, background-color 0.3s;
      position: relative;
    }
    .progress-bar-present { background: linear-gradient(90deg, #10b981, #34d399); }
    .progress-bar-absent { background: linear-gradient(90deg, #ef4444, #f87171); }
    .progress-percent {
      font-size: 12px;
      font-weight: 800;
      min-width: 42px;
      text-align: left;
      font-variant-numeric: tabular-nums;
      color: #334155;
      flex-shrink: 0;
    }

    .rate-low .rate-display-value { color: #dc2626; }
    .rate-medium .rate-display-value { color: #f59e0b; }
    .rate-high .rate-display-value { color: #059669; }

    #active-filter-badge {
      display: none;
      background: #0d9488;
      color: white;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      margin-bottom: 8px;
      text-align: center;
      font-weight: 700;
    }

    #input-mode-badge {
      display: block;
      text-align: center;
      margin-bottom: 6px;
      font-size: 11px;
      color: #64748b;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulseScanner {
      0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      50% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
    }
    .scanner-active {
      animation: pulseScanner 1s infinite;
      border-color: #10b981 !important;
    }

    .scanner-debug {
      display: none;
      background: #1e293b;
      color: #94a3b8;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 10px;
      font-family: monospace;
      margin-top: 6px;
      direction: ltr;
      text-align: left;
      max-height: 80px;
      overflow-y: auto;
    }
    .scanner-debug.visible { display: block; }
    .scanner-debug-entry { padding: 1px 0; }
    .scanner-debug-fast { color: #4ade80; }
    .scanner-debug-slow { color: #f87171; }

    /* Modal للقوائم */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 10000;
      padding: 20px;
      overflow-y: auto;
    }
    .modal-overlay.visible { display: flex; align-items: flex-start; justify-content: center; }
    .modal-content {
      background: white;
      border-radius: 16px;
      max-width: 480px;
      width: 100%;
      padding: 20px;
      margin-top: 40px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .modal-title {
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 12px;
      text-align: center;
    }
    .modal-body {
      font-size: 13px;
      color: #334155;
      line-height: 1.6;
    }
    .modal-close {
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      background: #64748b;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .pending-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 6px;
      font-size: 12px;
    }
    .pending-item-name { font-weight: bold; color: #0f172a; }
    .pending-item-meta { color: #64748b; font-size: 11px; margin-top: 2px; }
    .pending-empty {
      text-align: center;
      padding: 20px;
      color: #94a3b8;
      font-size: 13px;
    }
  </style>
</head>
<body>

<div class="container">
  <h3 class="title">نظام تسجيل الحضور والاختبارات</h3>

  <div class="status-bar" id="status-bar">
    <span id="net-status" class="status-online">🌐 متصل</span>
    <span id="pending-count">📋 معلق: 0</span>
  </div>

  <div class="admin-buttons">
    <button onclick="showPendingList()" class="admin-btn btn-view-pending">
      📋 عرض المعلقات
    </button>
    <button onclick="clearTodayScans()" class="admin-btn btn-clear-today">
      🗑️ مسح سجلات اليوم
    </button>
  </div>

  <div class="admin-buttons">
    <button onclick="showDiagnostics()" class="admin-btn btn-diagnostics">
      🔬 تشخيص البيانات
    </button>
    <button onclick="hardReset()" class="admin-btn btn-hard-reset">
      🔄 إعادة ضبط كاملة
    </button>
  </div>

  <button id="sync-btn" class="sync-btn" onclick="syncPendingScans()">🔄 رفع الحضور المخزن إلى Google Sheets</button>

  <div class="stats-panel" id="stats-panel">
    <div class="rate-display" id="rate-display">
      <div class="rate-display-label">📊 معدل الحضور الحالي</div>
      <div class="rate-display-value" id="rate-value">0%</div>
    </div>

    <div class="progress-row">
      <div class="progress-icon">✅</div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill progress-bar-present" id="present-bar" style="width: 0%;"></div>
      </div>
      <div class="progress-percent" id="present-percent">0%</div>
    </div>

    <div class="progress-row">
      <div class="progress-icon">❌</div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill progress-bar-absent" id="absent-bar" style="width: 0%;"></div>
      </div>
      <div class="progress-percent" id="absent-percent">0%</div>
    </div>

    <div style="text-align:center;font-size:11px;color:#94a3b8;margin-top:6px;" id="stats-hint">
      💡 ابدأ المسح لعرض المؤشرات
    </div>
  </div>

  <div class="input-group">
    <label>اسم الجلسة / المحاضرة / الاختبار:</label>
    <input type="text" id="sessionName" value="امتحان الحصة" onchange="saveInputState()">
  </div>

  <div class="grid-2">
    <div class="input-group">
      <label>اسم القاعة:</label>
      <input type="text" id="hallName" placeholder="مثال: قاعة A" onchange="saveInputState()">
    </div>
    <div class="input-group">
      <label>المساعد / الجهاز:</label>
      <input type="text" id="deviceInfo" placeholder="مثال: جهاز 1" onchange="saveInputState()">
    </div>
  </div>

  <div class="filter-section" style="background:#f8fafc;padding:10px;border-radius:8px;margin-bottom:10px;">
    <div style="font-size:12px;font-weight:700;color:#475569;margin-bottom:6px;">
      🎯 تصفية النتائج (اختياري - يسرّع البحث):
    </div>
    <div class="grid-2">
      <div class="input-group" style="margin-bottom:0;">
        <label>الصف الدراسي:</label>
        <select id="filterGrade" onchange="onFilterChange()">
          <option value="">جميع الصفوف</option>
        </select>
      </div>
      <div class="input-group" style="margin-bottom:0;">
        <label>المجموعة / الموعد:</label>
        <select id="filterGroup" onchange="onFilterChange()">
          <option value="">جميع المجموعات</option>
        </select>
      </div>
    </div>
    <button onclick="clearFilters()" style="width:100%;padding:6px;background:#f1f5f9;border:1px solid #cbd5e1;border-radius:6px;font-size:12px;cursor:pointer;margin-top:8px;">
      🔄 مسح جميع الفلاتر
    </button>
    <div id="filter-badge" style="font-size:11px;color:#64748b;font-weight:700;margin-top:6px;text-align:center;"></div>
  </div>

  <div id="active-filter-badge">
    🎯 الفلتر النشط: <span id="active-filter-text"></span>
  </div>

  <div class="input-group">
    <label>📝 ابحث بالاسم / الكود، أو استخدم ماسح الباركود:</label>
    <div id="input-mode-badge">
      <span class="scanner-mode-badge mode-keyboard" id="mode-indicator">
        ⌨️ وضع الكتابة
      </span>
    </div>
    <div style="display: flex; gap: 8px;">
      <input type="text" id="manualCode" placeholder="اكتب أو امسح الباركود هنا..." autofocus autocomplete="off" inputmode="text" spellcheck="false">
      <button class="btn" onclick="processManual()" style="width: 30%;">تسجيل</button>
    </div>
    <div id="search-results" class="search-results-list"></div>

    <div style="text-align:center;margin-top:8px;">
      <button onclick="toggleScannerDebug()" style="background:transparent;border:1px solid #cbd5e1;color:#64748b;padding:4px 10px;border-radius:6px;font-size:10px;cursor:pointer;">
        🔬 تشخيص الماسح
      </button>
    </div>
    <div id="scanner-debug" class="scanner-debug"></div>
  </div>

  <div class="camera-controls">
    <button id="camera-toggle-btn" class="btn btn-secondary" onclick="toggleCameraScanner()" style="flex:1;">
      📷 تشغيل الكاميرا
    </button>
  </div>

  <div id="reader" class="hidden"></div>

  <div id="student-card">
    <div class="student-name" id="card-name">--</div>
    <div class="student-details" id="card-info">--</div>
    <div class="status-msg" id="card-status">--</div>
    <div id="undo-container"></div>
  </div>
</div>

<!-- Modal للقوائم -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-title" id="modal-title">عنوان</div>
    <div class="modal-body" id="modal-body">محتوى</div>
    <button class="modal-close" onclick="closeModal()">إغلاق</button>
  </div>
</div>

<script>
  // ============================================================
  // ⚠️ رابط Google Apps Script الخاص بك
  // ============================================================
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzn3THPIqzLOrHsoIAY3LKSn-FfiTmt02R38huQ-75b_UqyyN_K9KZuGuuJi0niwaWzLw/exec";

  // ============================================================
  // 📦 المتغيرات العامة
  // ============================================================
  let html5QrcodeScanner = null;
  let isScannerRunning = false;
  let isProcessing = false;
  let studentsData = {};
  let studentsList = [];
  let scannedToday = new Set();
  let audioCtx = null;
  let scanTimeout = null;

  let currentFilterGrade = "";
  let currentFilterGroup = "";
  let filteredStudentsList = [];

  const SCANNER_THRESHOLD_MS = 30;
  const SCANNER_BUFFER_TIMEOUT_MS = 80;
  let lastKeystrokeTime = 0;
  let scannerBuffer = "";
  let scannerBufferTimer = null;
  let isScannerInput = false;
  let debugMode = false;

  let lastCameraScan = '';
  let lastCameraScanTime = 0;

  let isSyncing = false;
  let pendingRefreshTimer = null;

  // ============================================================
  // 🛡️ حماية التركيز
  // ============================================================
  (function() {
    const INPUT_IDS = ['manualCode', 'hallName', 'deviceInfo', 'sessionName'];
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Tab') {
        const active = document.activeElement;
        if (!active || !INPUT_IDS.includes(active.id)) {
          e.preventDefault();
          document.getElementById('manualCode').focus();
        }
      }
    });
    document.addEventListener('focusout', function(e) {
      if (!INPUT_IDS.includes(e.target.id)) return;
      setTimeout(() => {
        const active = document.activeElement;
        if (!active || active === document.body ||
            (!INPUT_IDS.includes(active.id) &&
             !active.closest('.search-results-list') &&
             !active.closest('.modal-content') &&
             active.tagName !== 'BUTTON' &&
             active.tagName !== 'SELECT')) {
          document.getElementById('manualCode').focus();
        }
      }, 50);
    });
  })();

  // ============================================================
  // 🔊 الأصوات
  // ============================================================
  function playBeep(type = 'success') {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'success') {
        osc.frequency.value = 900;
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } else if (type === 'warning') {
        osc.frequency.value = 500;
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      } else if (type === 'network-fail') {
        // نغمة مميزة لفشل الشبكة (نغمتان)
        osc.frequency.value = 300;
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
        setTimeout(() => {
          const osc2 = audioCtx.createOscillator();
          const gain2 = audioCtx.createGain();
          osc2.connect(gain2);
          gain2.connect(audioCtx.destination);
          osc2.frequency.value = 200;
          gain2.gain.setValueAtTime(0.3, audioCtx.currentTime);
          osc2.start();
          osc2.stop(audioCtx.currentTime + 0.2);
        }, 150);
      } else {
        osc.frequency.value = 250;
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }
    } catch (e) {}
  }

  // ============================================================
  // 🔬 تشخيص الماسح
  // ============================================================
  function toggleScannerDebug() {
    debugMode = !debugMode;
    document.getElementById('scanner-debug').classList.toggle('visible', debugMode);
    if (debugMode) logScannerDebug("🔬 وضع التشخيص مُفعّل", 'slow');
  }

  function logScannerDebug(message, type = 'slow') {
    if (!debugMode) return;
    const debugEl = document.getElementById('scanner-debug');
    const entry = document.createElement('div');
    entry.className = 'scanner-debug-entry scanner-debug-' + type;
    entry.textContent = '[' + new Date().toLocaleTimeString('en-GB') + '] ' + message;
    debugEl.appendChild(entry);
    debugEl.scrollTop = debugEl.scrollHeight;
    while (debugEl.children.length > 20) debugEl.removeChild(debugEl.firstChild);
  }

  // ============================================================
  // 🚀 التهيئة
  // ============================================================
  window.onload = function() {
    loadInputState();
    loadCachedStudents();
    loadTodayScanned();
    fetchStudentsList();
    updateUI();
    updateDashboard();
    focusScannerInput();

    window.addEventListener('online', handleOnline);
    window.addEventListener('offline', handleOffline);

    // 🚨 تحذير عند إغلاق مع وجود معلقات
    window.addEventListener('beforeunload', function(e) {
      const pending = getPendingScans();
      if (pending.length > 0) {
        e.preventDefault();
        e.returnValue = "لديك " + pending.length + " سجل معلق لم يُرفع بعد!";
        return e.returnValue;
      }
    });

    const manualInput = document.getElementById('manualCode');

    // 🌐 مستمع عام للماسح
    let globalBuffer = "";
    let globalBufferTimer = null;
    let globalLastTime = 0;

    document.addEventListener('keypress', function(e) {
      const now = Date.now();
      const diff = now - globalLastTime;
      globalLastTime = now;

      if (e.target === manualInput) return;
      if (e.target.closest('.modal-content')) return;
      if (e.ctrlKey || e.altKey || e.metaKey) return;

      if (diff < 50 || globalBuffer.length > 0) {
        if (e.key && e.key.length === 1) {
          globalBuffer += e.key;
          clearTimeout(globalBufferTimer);

          if (studentsData[globalBuffer.trim()]) {
            finalizeScannerInput(globalBuffer.trim());
            globalBuffer = "";
            return;
          }

          globalBufferTimer = setTimeout(() => {
            if (globalBuffer.length >= 2) {
              finalizeScannerInput(globalBuffer);
              globalBuffer = "";
            }
          }, 80);
        }
      } else {
        globalBuffer = e.key && e.key.length === 1 ? e.key : "";
      }
    });

    // ⌨️ مستمع خانة البحث
    manualInput.addEventListener('input', function(e) {
      const val = manualInput.value;
      const now = Date.now();
      const timeDiff = now - lastKeystrokeTime;
      lastKeystrokeTime = now;

      if (debugMode && val.length > 0) {
        const lastChar = val.slice(-1);
        logScannerDebug(
          `حرف "${lastChar}" | فرق: ${timeDiff}ms | ${timeDiff < SCANNER_THRESHOLD_MS ? '⚡ ماسح' : '👤 بشري'}`,
          timeDiff < SCANNER_THRESHOLD_MS ? 'fast' : 'slow'
        );
      }

      if (timeDiff < SCANNER_THRESHOLD_MS && val.length > 0) {
        isScannerInput = true;
        updateModeIndicator('scanner');
        scannerBuffer = val;

        const cleanVal = val.trim();
        if (studentsData[cleanVal]) {
          if (debugMode) logScannerDebug(`⚡ معالجة فورية: "${cleanVal}"`, 'fast');
          clearTimeout(scannerBufferTimer);
          finalizeScannerInput(cleanVal);
          return;
        }

        clearTimeout(scannerBufferTimer);
        scannerBufferTimer = setTimeout(() => {
          if (scannerBuffer.length >= 2) {
            if (debugMode) logScannerDebug(`⏱️ معالجة: "${scannerBuffer}"`, 'fast');
            finalizeScannerInput(scannerBuffer);
          }
          scannerBuffer = "";
          isScannerInput = false;
        }, SCANNER_BUFFER_TIMEOUT_MS);
      } else {
        isScannerInput = false;
        updateModeIndicator('keyboard');
      }

      if (!isScannerInput) {
        clearTimeout(scanTimeout);
        if (val.trim().length > 0) {
          scanTimeout = setTimeout(() => renderSearchResults(val), 150);
        } else {
          hideSearchResults();
        }
      }
    });

    manualInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === 'Tab') {
        e.preventDefault();
        hideSearchResults();
        const val = manualInput.value.trim();
        if (!val) return;

        clearTimeout(scannerBufferTimer);
        if (debugMode) logScannerDebug(`⏎ Enter فوري | "${val}"`, 'fast');
        finalizeScannerInput(val);
      }
    });

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.input-group')) hideSearchResults();
    });
  };

  // ============================================================
  // 🌐 معالجة حالة الاتصال
  // ============================================================
  function handleOnline() {
    updateUI();
    const pending = getPendingScans();
    if (pending.length > 0) {
      // 🔄 رفع تلقائي بعد 2 ثانية (لمنح الشبكة فرصة الاستقرار)
      setTimeout(() => {
        autoSync();
      }, 2000);
    }
  }

  function handleOffline() {
    updateUI();
    // إشعار بصري
    const statusBar = document.getElementById('status-bar');
    statusBar.classList.remove('online-clean', 'online-pending');
    statusBar.classList.add('offline');
  }

  // ============================================================
  // 🔄 مزامنة تلقائية
  // ============================================================
  function autoSync() {
    const pending = getPendingScans();
    if (pending.length === 0 || isSyncing || !navigator.onLine) return;
    syncPendingScans();
  }

  // ============================================================
  // 🎯 معالجة إدخال الماسح
  // ============================================================
  function finalizeScannerInput(code) {
    const cleanCode = String(code).trim();
    if (!cleanCode) return;
    if (debugMode) logScannerDebug(`🎯 معالجة: "${cleanCode}"`, 'fast');

    if (studentsData[cleanCode]) {
      handleScan(cleanCode);
      document.getElementById('manualCode').value = '';
      focusScannerInput();
      return;
    }

    const q = cleanCode.toLowerCase();
    const matched = studentsList.find(s =>
      String(s.code).toLowerCase() === q
    );

    if (matched) {
      if (debugMode) logScannerDebug(`🔍 مطابقة: ${matched.name}`, 'fast');
      handleScan(matched.code);
    } else {
      if (debugMode) logScannerDebug(`❌ لا يوجد مطابقة`, 'slow');
      handleScan(cleanCode);
    }
    document.getElementById('manualCode').value = '';
    focusScannerInput();
  }

  function updateModeIndicator(mode) {
    const indicator = document.getElementById('mode-indicator');
    if (!indicator) return;
    if (mode === 'scanner') {
      indicator.className = 'scanner-mode-badge mode-scanner';
      indicator.innerHTML = '📡 وضع الماسح (باركود)';
      document.getElementById('manualCode').classList.add('scanner-active');
      setTimeout(() => document.getElementById('manualCode').classList.remove('scanner-active'), 400);
    } else {
      indicator.className = 'scanner-mode-badge mode-keyboard';
      indicator.innerHTML = '⌨️ وضع الكتابة';
    }
  }

  // ============================================================
  // 🕐 الوقت الحالي
  // ============================================================
  function getCurrentTimestamp() {
    const now = new Date();
    return now.getFullYear() + "-" +
           String(now.getMonth()+1).padStart(2,'0') + "-" +
           String(now.getDate()).padStart(2,'0') + " " +
           now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', hour12: true });
  }

  // ============================================================
  // 🎯 الفلاتر
  // ============================================================
  function buildFilterOptions() {
    const gradesSet = new Set();
    const groupsSet = new Set();
    studentsList.forEach(s => {
      if (s.grade && s.grade !== "غير محدد") gradesSet.add(String(s.grade).trim());
      if (s.group && s.group !== "عامة") groupsSet.add(String(s.group).trim());
    });

    const gradeSelect = document.getElementById('filterGrade');
    const groupSelect = document.getElementById('filterGroup');

    gradeSelect.innerHTML = '<option value="">جميع الصفوف</option>';
    [...gradesSet].sort().forEach(g => {
      const opt = document.createElement('option');
      opt.value = g;
      opt.textContent = g;
      gradeSelect.appendChild(opt);
    });

    groupSelect.innerHTML = '<option value="">جميع المجموعات</option>';
    [...groupsSet].sort().forEach(g => {
      const opt = document.createElement('option');
      opt.value = g;
      opt.textContent = g;
      groupSelect.appendChild(opt);
    });

    const savedGrade = localStorage.getItem('filter_grade');
    const savedGroup = localStorage.getItem('filter_group');
    if (savedGrade && [...gradesSet].includes(savedGrade)) gradeSelect.value = savedGrade;
    if (savedGroup && [...groupsSet].includes(savedGroup)) groupSelect.value = savedGroup;

    onFilterChange();
  }

  function onFilterChange() {
    currentFilterGrade = document.getElementById('filterGrade').value;
    currentFilterGroup = document.getElementById('filterGroup').value;
    localStorage.setItem('filter_grade', currentFilterGrade);
    localStorage.setItem('filter_group', currentFilterGroup);

    filteredStudentsList = studentsList.filter(s => {
      const matchGrade = !currentFilterGrade || String(s.grade).trim() === currentFilterGrade;
      const matchGroup = !currentFilterGroup || String(s.group).trim() === currentFilterGroup;
      return matchGrade && matchGroup;
    });

    updateFilterBadge();
    updateDashboard();
    const manualInput = document.getElementById('manualCode');
    if (manualInput.value.trim().length > 0) renderSearchResults(manualInput.value);
  }

  function updateFilterBadge() {
    const badge = document.getElementById('filter-badge');
    if (!badge) return;
    const total = filteredStudentsList.length;
    const isFiltered = currentFilterGrade || currentFilterGroup;
    if (isFiltered) {
      badge.innerHTML = `✅ الفلتر مطبّق - ${total} طالب`;
      badge.style.color = '#0d9488';
    } else {
      badge.innerHTML = `📚 لم يتم تطبيق فلتر`;
      badge.style.color = '#64748b';
    }

    const activeBadge = document.getElementById('active-filter-badge');
    const activeText = document.getElementById('active-filter-text');
    const parts = [];
    if (currentFilterGrade) parts.push(currentFilterGrade);
    if (currentFilterGroup) parts.push(currentFilterGroup);
    if (parts.length > 0) {
      activeText.textContent = parts.join(" • ");
      activeBadge.style.display = "block";
    } else {
      activeBadge.style.display = "none";
    }
  }

  function clearFilters() {
    document.getElementById('filterGrade').value = "";
    document.getElementById('filterGroup').value = "";
    onFilterChange();
  }

  // ============================================================
  // 📊 لوحة الإحصائيات
  // ============================================================
  function updateDashboard() {
    const session = document.getElementById('sessionName').value.trim();
    const todayDate = new Date().toISOString().slice(0, 10);
    const todaySuffix = "_" + session + "_" + todayDate;

    const totalStudents = (currentFilterGrade || currentFilterGroup)
      ? filteredStudentsList.length
      : studentsList.length;

    let presentCount = 0;
    const filteredCodes = new Set(filteredStudentsList.map(s => String(s.code).trim()));
    const hasFilter = currentFilterGrade || currentFilterGroup;

    scannedToday.forEach(key => {
      if (!key.endsWith(todaySuffix)) return;
      const code = key.split("_")[0];
      if (hasFilter && !filteredCodes.has(code)) return;
      presentCount++;
    });

    const absentCount = Math.max(0, totalStudents - presentCount);
    const presentRate = totalStudents > 0 ? Math.round((presentCount / totalStudents) * 100) : 0;
    const absentRate = totalStudents > 0 ? Math.round((absentCount / totalStudents) * 100) : 0;
    const rate = presentRate;

    document.getElementById('present-bar').style.width = presentRate + '%';
    document.getElementById('absent-bar').style.width = absentRate + '%';
    document.getElementById('present-percent').innerText = presentRate + '%';
    document.getElementById('absent-percent').innerText = absentRate + '%';
    document.getElementById('rate-value').innerText = rate + '%';

    const panel = document.getElementById('rate-display');
    panel.parentElement.classList.remove('rate-low', 'rate-medium', 'rate-high');
    if (totalStudents === 0 || presentCount === 0) {
      // لا شيء
    } else if (rate < 50) {
      panel.parentElement.classList.add('rate-low');
    } else if (rate < 75) {
      panel.parentElement.classList.add('rate-medium');
    } else {
      panel.parentElement.classList.add('rate-high');
    }

    const hint = document.getElementById('stats-hint');
    if (totalStudents === 0) {
      hint.innerText = '⚠️ لم يتم تحميل الطلاب بعد';
      hint.style.color = '#dc2626';
    } else if (presentCount === 0) {
      hint.innerText = '💡 ابدأ المسح لعرض المؤشرات';
      hint.style.color = '#94a3b8';
    } else {
      hint.innerText = '✨ يتم التحديث لحظياً مع كل مسح';
      hint.style.color = '#0d9488';
    }
  }

  // ============================================================
  // 🔍 البحث والعرض
  // ============================================================
  function renderSearchResults(query) {
    const resultsContainer = document.getElementById('search-results');
    const q = query.toLowerCase().trim();
    const sourceList = (currentFilterGrade || currentFilterGroup)
      ? filteredStudentsList
      : studentsList;

    const allMatches = sourceList.filter(s =>
      String(s.name).toLowerCase().includes(q) ||
      String(s.code).toLowerCase().includes(q)
    );
    const matches = allMatches.slice(0, 12);

    if (matches.length === 0) {
      hideSearchResults();
      return;
    }

    resultsContainer.innerHTML = '';

    if (allMatches.length > 12) {
      const header = document.createElement('div');
      header.style.cssText = 'padding:6px 12px;font-size:11px;background:#fef3c7;color:#92400e;font-weight:700;text-align:center;border-bottom:1px solid #fcd34d;';
      header.textContent = `⚠️ ${allMatches.length} نتيجة - استخدم الفلاتر (يظهر أول 12 فقط)`;
      resultsContainer.appendChild(header);
    }

    matches.forEach(s => {
      const div = document.createElement('div');
      div.className = 'search-item';
      div.innerHTML = `
        <div class="search-item-name">👤 ${escapeHtml(s.name)}</div>
        <div class="search-item-meta">
          كود: ${escapeHtml(String(s.code))} | الصف: ${escapeHtml(s.grade)} | الموعد: ${escapeHtml(s.group)}
        </div>
      `;
      div.onclick = () => selectStudentFromSearch(String(s.code));
      resultsContainer.appendChild(div);
    });

    resultsContainer.style.display = 'block';
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[m]);
  }

  function selectStudentFromSearch(code) {
    hideSearchResults();
    document.getElementById('manualCode').value = code;
    handleScan(code);
    document.getElementById('manualCode').value = '';
    focusScannerInput();
  }

  function hideSearchResults() {
    const r = document.getElementById('search-results');
    if (r) r.style.display = 'none';
  }

  function focusScannerInput() {
    const input = document.getElementById('manualCode');
    if (input) input.focus();
  }

  // ============================================================
  // 💾 الحفظ والاسترجاع
  // ============================================================
  function saveInputState() {
    localStorage.setItem('saved_session', document.getElementById('sessionName').value);
    localStorage.setItem('saved_hallName', document.getElementById('hallName').value);
    localStorage.setItem('saved_deviceInfo', document.getElementById('deviceInfo').value);
    updateDashboard();

  function loadInputState() {

    const h = localStorage.getItem('saved_hallName');

    if (s) document.getElementById('sessionName').value = s;

  // ============================================================
  // 🌐 حالة الاتصال
  // ============================================================
  function updateUI() {
    const isOnline = navigator.onLine;
    const netStatus = document.getElementById('net-status');
    const syncBtn = document.getElementById('sync-btn');
    const statusBar = document.getElementById('status-bar');
    const pending = getPendingScans();

    document.getElementById('pending-count').innerText = "📋 معلق: " + pending.length;

    statusBar.classList.remove('online-clean', 'online-pending', 'offline');

    if (isOnline) {
      if (pending.length > 0) {
        netStatus.className = "status-pending";
        netStatus.innerText = "🌐 متصل";
        statusBar.classList.add('online-pending');
        syncBtn.style.display = "block";
      } else {
        netStatus.className = "status-online";
        netStatus.innerText = "🌐 متصل";
        statusBar.classList.add('online-clean');
        syncBtn.style.display = "none";
      }
    } else {
      netStatus.className = "status-offline";
      netStatus.innerText = "📡 أوفلاين";
      statusBar.classList.add('offline');
      syncBtn.style.display = "none";
    }
  }

  // ============================================================
  // 📥 جلب الطلاب
  // ============================================================
  function fetchStudentsList() {
    if (!navigator.onLine) return Promise.resolve();
    return fetch(SCRIPT_URL + "?action=getStudents&t=" + Date.now())
      .then(res => res.json())
      .then(data => {
        if (data.success && data.students) {
          const map = {};
          studentsList = data.students;
          data.students.forEach(s => { map[String(s.code).trim()] = s; });
          studentsData = map;
          localStorage.setItem('cached_students', JSON.stringify(map));
          localStorage.setItem('cached_students_list', JSON.stringify(data.students));
          localStorage.setItem('cached_students_time', Date.now().toString());
          buildFilterOptions();
          updateDashboard();
          return data.students.length;
        }
        return 0;
      })
      .catch(err => {
        console.log("تعذر تحديث الكشوفات:", err);
        return 0;
      });
  }

  function loadCachedStudents() {
    const cachedMap = localStorage.getItem('cached_students');
    const cachedArr = localStorage.getItem('cached_students_list');
    if (cachedMap) {
      try { studentsData = JSON.parse(cachedMap); } catch (e) {}
    }
    if (cachedArr) {
      try {
        studentsList = JSON.parse(cachedArr);
        setTimeout(buildFilterOptions, 100);
      } catch (e) {}
    }
  }

  // ============================================================
  // 📅 تتبع مسح اليوم
  // ============================================================
  function loadTodayScanned() {
    const todayKey = 'scanned_' + new Date().toISOString().slice(0, 10);
    const saved = localStorage.getItem(todayKey);
    if (saved) {
      try { scannedToday = new Set(JSON.parse(saved)); } catch (e) {}
    } else {
      scannedToday = new Set();
    }
  }

  function recordLocalScan(code) {
    const todayKey = 'scanned_' + new Date().toISOString().slice(0, 10);
    scannedToday.add(code);
    localStorage.setItem(todayKey, JSON.stringify(Array.from(scannedToday)));
    updateDashboard();
  }

  function removeLocalScan(code) {
    const todayKey = 'scanned_' + new Date().toISOString().slice(0, 10);
    scannedToday.delete(code);
    localStorage.setItem(todayKey, JSON.stringify(Array.from(scannedToday)));
    updateDashboard();
  }

  // ============================================================
  // 📤 السجلات المعلقة (مع فحص المساحة)
  // ============================================================
  function getPendingScans() {
    try {
      const list = localStorage.getItem('pending_scans');
      return list ? JSON.parse(list) : [];
    } catch (e) {
      console.error("خطأ في قراءة المعلقات:", e);
      return [];
    }
  }

  function savePendingScans(scans) {
    try {
      const serialized = JSON.stringify(scans);
      const sizeKB = Math.round(serialized.length / 1024);

      // 🚨 تحذير عند اقتراب الحد (5MB)
      if (sizeKB > 4000) {
        console.warn("⚠️ تحذير: التخزين قارب على الامتلاء (" + sizeKB + " KB)");
        if (sizeKB > 4500) {
          alert("🚨 تحذير عاجل!\n\nمساحة التخزين على وشك الامتلاء!\n" +
                "الحجم الحالي: " + sizeKB + " KB\n" +
                "الحد الأقصى: ~5000 KB\n\n" +
                "الرجاء الرفع إلى Google Sheets فوراً!");
        }
      }

      localStorage.setItem('pending_scans', serialized);
      updateUI();
      return true;
    } catch (e) {
      console.error("فشل حفظ المعلقات:", e);
      if (e.name === 'QuotaExceededError') {
        alert("🚨 خطأ حرج!\n\n" +
              "مساحة التخزين ممتلئة!\n" +
              "لا يمكن حفظ المزيد من السجلات.\n\n" +
              "الحل:\n" +
              "1. اتصل بالإنترنت\n" +
              "2. اضغط 'رفع الآن'\n" +
              "3. حاول مرة أخرى");
      }
      return false;
    }
  }

  // ============================================================
  // 💾 حفظ فوري (قبل أي شيء)
  // ============================================================
  function storeLocallySafe(record) {
    const pending = getPendingScans();
    // تحقق من عدم التكرار
    const exists = pending.some(item =>
      item.code === record.code &&
      item.sessionName === record.sessionName &&
      item.timestamp === record.timestamp
    );
    if (exists) return true;

    pending.push(record);
    return savePendingScans(pending);
  }

  // ============================================================
  // 📷 الكاميرا
  // ============================================================
  function startCameraScanner() {
    if (html5QrcodeScanner) return;
    html5QrcodeScanner = new Html5QrcodeScanner(
      "reader",
      { fps: 25, qrbox: { width: 250, height: 250 } },
      false
    );
    html5QrcodeScanner.render(onScanSuccess, onScanError);
    isScannerRunning = true;
    document.getElementById('reader').classList.remove('hidden');
    document.getElementById('camera-toggle-btn').innerText = "🛑 إيقاف الكاميرا";
  }

  function stopCameraScanner() {
    if (!html5QrcodeScanner) return;
    html5QrcodeScanner.clear().then(() => {
      html5QrcodeScanner = null;
      isScannerRunning = false;
      document.getElementById('reader').classList.add('hidden');
      document.getElementById('camera-toggle-btn').innerText = "📷 تشغيل الكاميرا";
      focusScannerInput();
    }).catch(err => console.log("خطأ في إيقاف الكاميرا:", err));
  }

  function toggleCameraScanner() {
    if (isScannerRunning) stopCameraScanner();
    else startCameraScanner();
  }

  function onScanSuccess(decodedText) {
    const now = Date.now();
    if (decodedText === lastCameraScan && (now - lastCameraScanTime) < 800) {
      return;
    }
    lastCameraScan = decodedText;
    lastCameraScanTime = now;
    handleScan(decodedText);
  }

  function onScanError(errorMessage) {}

  // ============================================================
  // 🎯 الإدخال اليدوي
  // ============================================================
  function processManual() {
    const codeInput = document.getElementById('manualCode');
    const inputVal = codeInput.value.trim();
    if (!inputVal) return;

    if (studentsData[inputVal]) {
      handleScan(inputVal);
      codeInput.value = '';
      focusScannerInput();
      return;
    }

    const q = inputVal.toLowerCase();
    const matched = studentsList.find(s =>
      String(s.name).toLowerCase().includes(q) ||
      String(s.code).toLowerCase().includes(q)
    );

    if (matched) handleScan(matched.code);
    else handleScan(inputVal);

    codeInput.value = '';
    focusScannerInput();
  }

  // ============================================================
  // 🎯 معالجة المسح الرئيسية (حماية قصوى)
  // ============================================================
  function handleScan(code) {
    const cleanCode = String(code).trim();
    const session = document.getElementById('sessionName').value.trim();
    const hall = document.getElementById('hallName').value.trim();
    const device = document.getElementById('deviceInfo').value.trim();

    const todayDate = new Date().toISOString().slice(0, 10);
    const scanKey = cleanCode + "_" + session + "_" + todayDate;

    const student = studentsData[cleanCode];
    const timestamp = getCurrentTimestamp();

    // ❌ كود غير مسجل
    if (!student) {
      isProcessing = true;
      playBeep('error');
      showCard("❌ كود غير مسجل", "المدخل: " + cleanCode, "هذا الطالب غير موجود بجدول البيانات!", "error");
      setTimeout(() => { isProcessing = false; focusScannerInput(); }, 800);
      return;
    }

    // ⚠️ مسجل محلياً
    if (scannedToday.has(scanKey)) {
      isProcessing = true;
      playBeep('warning');
      showCard(
        "⚠️ " + student.name,
        "الكود: " + student.code + " | الصف: " + student.grade,
        "الطالب مسجل حضور بالفعل اليوم لهذا الدرس!",
        "warning"
      );
      setTimeout(() => { isProcessing = false; focusScannerInput(); }, 800);
      return;
    }

    // ============================================
    // 🔒 1. حفظ فوري (قبل أي شيء)
    // ============================================
    recordLocalScan(scanKey);
    const scanRecord = {
      code: cleanCode,
      sessionName: session,
      hallName: hall,
      deviceInfo: device,
      timestamp: timestamp
    };

    // ⚡ 2. عرض فوري
    playBeep('success');
    showCard(
      "✅ " + student.name,
      "الصف: " + student.grade + " | المجموعة: " + student.group +
      "<br>القاعة: " + (hall || "افتراضي") + " | المصدر: " + (device || "افتراضي"),
      "تم التسجيل بنجاح الساعة " + timestamp,
      "success",
      cleanCode
    );

    // ⚡ 3. إرسال للسيرفر
    if (navigator.onLine) {
      fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "recordScan",
          code: cleanCode,
          sessionName: session,
          hallName: hall,
          deviceInfo: device,
          timestamp: timestamp
        })
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          if (debugMode) logScannerDebug(`✅ السيرفر قبل: ${student.name}`, 'fast');
        } else if (res.duplicate) {
          if (debugMode) logScannerDebug(`⚠️ السيرفر رفض: مسجل مسبقاً`, 'slow');
          playBeep('warning');
          showCard(
            "⚠️ " + student.name,
            "الكود: " + student.code + " | الصف: " + student.grade,
            "الطالب مسجل حضور بالفعل في Google Sheets لهذا الدرس!",
            "warning"
          );
        } else {
          if (debugMode) logScannerDebug(`❌ خطأ: ${res.message}`, 'slow');
          // خزّن محلياً (لم يُرفع)
          storeLocallySafe(scanRecord);
        }
      })
      .catch(err => {
        // 🌐 فشل الشبكة → خزّن محلياً
        if (debugMode) logScannerDebug(`🌐 فشل الشبكة - تخزين محلي`, 'slow');
        playBeep('network-fail');
        const saved = storeLocallySafe(scanRecord);
        if (saved) {
          // أضف ملاحظة للبطاقة
          const cardStatus = document.getElementById('card-status');
          cardStatus.innerHTML += '<br>⚠️ لم يُرفع (سيُرفع لاحقاً)';
        }
      });
    } else {
      // 📡 أوفلاين → خزّن محلياً
      const saved = storeLocallySafe(scanRecord);
      const cardStatus = document.getElementById('card-status');
      if (saved) {
        cardStatus.innerHTML += '<br>📡 سيُرفع عند عودة الإنترنت';
      }
    }

    focusScannerInput();
  }

  // ============================================================
  // ↩️ التراجع
  // ============================================================
  function undoScan(cleanCode) {
    const session = document.getElementById('sessionName').value.trim();
    const todayDate = new Date().toISOString().slice(0, 10);
    const scanKey = cleanCode + "_" + session + "_" + todayDate;

    removeLocalScan(scanKey);

    let pending = getPendingScans();
    const wasPending = pending.some(item => item.code === cleanCode && item.sessionName === session);
    pending = pending.filter(item => !(item.code === cleanCode && item.sessionName === session));
    savePendingScans(pending);

    if (!wasPending && navigator.onLine) {
      fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "undoScan", code: cleanCode, sessionName: session })
      }).catch(err => console.log("خطأ في التراجع:", err));
    }

    playBeep('warning');
    showCard("↩️ تم التراجع", "الكود: " + cleanCode, "تم إلغاء تسجيل الحضور بنجاح.", "warning");
    focusScannerInput();
  }

  // ============================================================
  // 🔄 المزامنة الذكية (رفع + سحب)
  // ============================================================
  function syncPendingScans() {
    if (isSyncing) return;
    const pending = getPendingScans();
    if (pending.length === 0) {
      // لا يوجد معلقات، لكن يمكن أن نسحب قائمة محدثة
      if (navigator.onLine) {
        fetchStudentsList().then(() => {
          updateUI();
        });
      }
      return;
    }

    if (!navigator.onLine) {
      alert("❌ لا يوجد إنترنت.\nالرجاء الاتصال بالشبكة أولاً.");
      return;
    }

    isSyncing = true;
    const syncBtn = document.getElementById('sync-btn');
    const originalText = syncBtn.innerText;
    syncBtn.innerText = "⏳ جاري الرفع (" + pending.length + " سجل)...";
    syncBtn.disabled = true;

    // 🔄 الخطوة 1: رفع المعلقات
    fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "syncBatch", scans: pending })
    })
    .then(res => res.json())
    .then(res => {
      if (res.success) {
        // ✅ الرفع نجح → امسح المعلقات
        savePendingScans([]);

        // 🔄 الخطوة 2: سحب قائمة محدثة من الطلاب
        syncBtn.innerText = "📥 جاري تحديث قائمة الطلاب...";
        return fetchStudentsList();
      } else {
        throw new Error(res.message || "فشل الرفع");
      }
    })
    .then(() => {
      // ✅ اكتملت المزامنة
      syncBtn.innerText = "✅ تمت المزامنة بنجاح";
      playBeep('success');

      setTimeout(() => {
        syncBtn.innerText = originalText;
        syncBtn.disabled = false;
        isSyncing = false;
        updateUI();
        updateDashboard();
      }, 1500);
    })
    .catch(err => {
      console.error("خطأ في المزامنة:", err);
      alert("❌ تعذر إكمال المزامنة\n\n" + (err.message || "خطأ غير معروف") + 
            "\n\nالسجلات المعلقة محفوظة بأمان، حاول مرة أخرى.");
      syncBtn.innerText = originalText;
      syncBtn.disabled = false;
      isSyncing = false;
    });
  }

  // ============================================================
  // 🗑️ مسح سجلات اليوم (محلياً فقط)
  // ============================================================
  function clearTodayScans() {
    if (!confirm(
      "⚠️ هل تريد مسح سجلات اليوم من المتصفح؟\n\n" +
      "📌 ملاحظة مهمة:\n" +
      "• هذا لا يحذف شيئاً من Google Sheets\n" +
      "• فقط يمسح السجلات المحلية لليوم\n" +
      "• مفيد لإعادة عرض الإحصائيات من الصفر\n\n" +
      "هل أنت متأكد؟"
    )) return;

    const todayKey = 'scanned_' + new Date().toISOString().slice(0, 10);
    localStorage.removeItem(todayKey);
    scannedToday = new Set();
    updateDashboard();

    playBeep('success');
    alert("✅ تم مسح سجلات اليوم محلياً.\n\n" +
          "📌 ملاحظة: Google Sheets لم يتأثر.");
    focusScannerInput();
  }

  // ============================================================
  // 🔄 إعادة ضبط كاملة (محلياً فقط)
  // ============================================================
  function hardReset() {
    const pending = getPendingScans();
    let warnPending = "";
    if (pending.length > 0) {
      warnPending = "\n\n🚨🚨 تحذير شديد! 🚨🚨\n" +
                    "لديك " + pending.length + " سجل معلّق (لم يُرفع بعد)!\n" +
                    "إذا واصلت، ستُفقد هذه السجلات نهائياً!\n";
    }

    if (!confirm(
      "⚠️ إعادة ضبط كاملة\n\n" +
      "📌 سيتم مسح:\n" +
      "• سجلات اليوم\n" +
      "• الكاش (قائمة الطلاب)\n" +
      "• الفلاتر المحفوظة\n" +
      "• الإعدادات المحفوظة" +
      warnPending +
      "\n\n📌 Google Sheets لن يتأثر.\n\n" +
      "هل أنت متأكد؟"
    )) return;

    // تحذير إضافي إذا كان هناك معلقات
    if (pending.length > 0) {
      if (!confirm(
        "🚨🚨 تأكيد أخير 🚨🚨\n\n" +
        "لا تزال لديك " + pending.length + " سجل معلق!\n" +
        "إذا واصلت، ستُفقد نهائياً!\n\n" +
        "هل رفعت السجلات مسبقاً؟"
      )) return;
    } else {
      if (!confirm("🚨 تأكيد أخير!\n\nهل تريد فعلاً إعادة الضبط؟")) return;
    }

    localStorage.clear();
    alert("✅ تم إعادة الضبط الكامل.\nسيُعاد تحميل الصفحة الآن...");
    location.reload();
  }

  // ============================================================
  // 📋 Modal للقوائم
  // ============================================================
  function openModal(title, contentHTML) {
    document.getElementById('modal-title').innerText = title;
    document.getElementById('modal-body').innerHTML = contentHTML;
    document.getElementById('modal-overlay').classList.add('visible');
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('visible');
    focusScannerInput();
  }

  // ============================================================
  // 📋 عرض قائمة السجلات المعلقة
  // ============================================================
  function showPendingList() {
    const pending = getPendingScans();

    if (pending.length === 0) {
      openModal('📋 السجلات المعلقة',
        '<div class="pending-empty">' +
        '✅ لا يوجد سجلات معلقة<br>' +
        '<small>كل السجلات مرفوعة إلى Google Sheets</small>' +
        '</div>'
      );
      return;
    }

    let html = '<div style="text-align:center;margin-bottom:10px;padding:8px;background:#fef3c7;border-radius:8px;color:#92400e;font-weight:700;">';
    html += '⚠️ ' + pending.length + ' سجل بانتظار الرفع';
    html += '</div>';

    pending.forEach((item, idx) => {
      const student = studentsData[item.code];
      const name = student ? student.name : 'كود: ' + item.code;
      html += `
        <div class="pending-item">
          <div class="pending-item-name">${idx + 1}. ${escapeHtml(name)}</div>
          <div class="pending-item-meta">
            📚 ${escapeHtml(item.sessionName)} | 🕐 ${escapeHtml(item.timestamp)}
          </div>
        </div>
      `;
    });

    html += '<div style="text-align:center;margin-top:12px;font-size:11px;color:#64748b;">';
    html += '💾 محفوظة بأمان في ذاكرة الجهاز';
    html += '</div>';

    openModal('📋 السجلات المعلقة', html);
  }

  // ============================================================
  // 🔬 تشخيص البيانات
  // ============================================================
  function showDiagnostics() {
    const pending = getPendingScans();
    const todayKey = 'scanned_' + new Date().toISOString().slice(0, 10);
    const todayScans = JSON.parse(localStorage.getItem(todayKey) || '[]');
    const keys = Object.keys(localStorage);
    const totalSizeKB = Math.round(JSON.stringify(localStorage).length / 1024);
    const cachedStudents = JSON.parse(localStorage.getItem('cached_students_list') || '[]');
    const lastUpdate = localStorage.getItem('cached_students_time');

    let lastUpdateStr = 'لم يتم';
    if (lastUpdate) {
      const d = new Date(parseInt(lastUpdate));
      lastUpdateStr = d.toLocaleString('ar-EG');
    }

    // حساب النسبة من الحد الأقصى (5MB)
    const maxKB = 5000;
    const percent = Math.round(totalSizeKB / maxKB * 100);
    let color = '#059669';
    if (percent > 50) color = '#f59e0b';
    if (percent > 80) color = '#dc2626';

    let html = `
      <div style="display:grid;gap:8px;">
        <div style="background:#f8fafc;padding:10px;border-radius:8px;">
          <div style="font-weight:700;color:#0d9488;margin-bottom:4px;">📋 السجلات المعلقة</div>
          <div style="font-size:20px;font-weight:900;">${pending.length}</div>
        </div>
        
        <div style="background:#f8fafc;padding:10px;border-radius:8px;">
          <div style="font-weight:700;color:#0d9488;margin-bottom:4px;">📅 سجلات اليوم</div>
          <div style="font-size:20px;font-weight:900;">${todayScans.length}</div>
        </div>
        
        <div style="background:#f8fafc;padding:10px;border-radius:8px;">
          <div style="font-weight:700;color:#0d9488;margin-bottom:4px;">👥 الطلاب المخزنون</div>
          <div style="font-size:20px;font-weight:900;">${cachedStudents.length}</div>
        </div>
        
        <div style="background:#f8fafc;padding:10px;border-radius:8px;">
          <div style="font-weight:700;color:#0d9488;margin-bottom:4px;">🕐 آخر تحديث للطلاب</div>
          <div style="font-size:12px;">${lastUpdateStr}</div>
        </div>
        
        <div style="background:#f8fafc;padding:10px;border-radius:8px;">
          <div style="font-weight:700;color:${color};margin-bottom:4px;">💾 مساحة التخزين</div>
          <div style="font-size:14px;font-weight:700;">${totalSizeKB} KB / ${maxKB} KB</div>
          <div style="height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin-top:4px;">
            <div style="height:100%;width:${percent}%;background:${color};border-radius:4px;transition:width 0.3s;"></div>
          </div>
          <div style="font-size:11px;color:${color};margin-top:2px;">${percent}% مستخدم</div>
        </div>
        
        <div style="background:#f8fafc;padding:10px;border-radius:8px;">
          <div style="font-weight:700;color:#0d9488;margin-bottom:4px;">🔑 المفاتيح المحفوظة</div>
          <div style="font-size:11px;font-family:monospace;direction:ltr;text-align:left;">
            ${keys.map(k => '• ' + k).join('<br>')}
          </div>
        </div>
      </div>
    `;

    openModal('🔬 تشخيص البيانات', html);
  }

  // ============================================================
  // 🎴 بطاقة الطالب
  // ============================================================
  function showCard(name, info, status, type, codeForUndo = null) {
    const card = document.getElementById('student-card');
    const undoContainer = document.getElementById('undo-container');

    document.getElementById('card-name').innerText = name;
    document.getElementById('card-info').innerHTML = info;
    document.getElementById('card-status').innerText = status;

    if (type === 'success' && codeForUndo) {
      undoContainer.innerHTML = '';
      const btn = document.createElement('button');
      btn.className = 'undo-btn';
      btn.textContent = '↩️ تراجع عن التسجيل';
      btn.onclick = () => undoScan(codeForUndo);
      undoContainer.appendChild(btn);
    } else {
      undoContainer.innerHTML = '';
    }

    card.className = "card-" + type;
    card.style.display = "block";
  }
</script>
